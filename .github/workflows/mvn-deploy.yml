name: Maven CI/CD with Trivy and Deployment

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Maven Package Job
  package:
    name: Maven Package (no tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven Package
        run: mvn -B clean package -DskipTests

      # Create Artifact - Jar Builds
      - name: Jar Builds
        uses: actions/upload-artifact@v4.4.2
        with:
          name: Jar with Builds
          path: target/*.jar

  # Trivy File Scan Job
  trivy-file-scan:
    name: Trivy File Scan
    needs: package
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:latest
    steps:
      - uses: actions/checkout@v4
      - name: Maven Build
        run: mvn clean install -DskipTests
      - name: Trivy Vulnerability Scan
        run: trivy fs . --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs target

  # Documentation Generation Job
  documentation:
    name: Generate Documentation
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate KDoc Documentation
        run: mvn -B dokka:dokka
      - name: Archive KDoc Documentation
        uses: actions/upload-artifact@v4.4.2
        with:
          name: KDoc Documentation Site
          path: target/dokka

  # Maven Tests Job
  test:
    name: Run Maven Tests
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run Tests
        run: mvn -B clean verify

  # Deployment Job
  deploy:
    name: Railway Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
