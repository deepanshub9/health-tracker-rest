name: Deploy to Railway

on: [push, pull_request]

jobs:

  package:
    name: Maven Package (no tests) 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven Package
        run: mvn -B clean package -DskipTests
        
      # Create Artifact - Jar Builds 
      - name: Jar Builds
        uses: actions/upload-artifact@v4.4.2
        with:
          name: Jar with Builds
          path: target/*.jar    

  trivy-scan:
    name: Trivy Scan
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -LO https://github.com/aquasecurity/trivy/releases/latest/download/trivy_$(uname -s)_$(uname -m).tar.gz
          tar zxvf trivy_$(uname -s)_$(uname -m).tar.gz -C /usr/local/bin
          rm -f trivy_$(uname -s)_$(uname -m).tar.gz

      - name: Verify Trivy Installation
        run: |
          ls -l /usr/local/bin/trivy
          /usr/local/bin/trivy --version

      - name: Run Trivy Scan
        run: |
          /usr/local/bin/trivy fs . --exit-code 0 --severity HIGH,CRITICAL

  documentation: 
    runs-on: ubuntu-latest
    needs: package
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it 
      - uses: actions/checkout@v4

      # Runs the Maven dokka task
      - name: Dokka with Maven
        run: mvn -B dokka:dokka

      # Builds a zip file with the KDoc generated website in it 
      - name: Archive KDoc Documentation
        uses: actions/upload-artifact@v4.4.2
        with:
          name: KDoc Documentation Site
          path: target/dokka  

  test:
    name: Maven Tests
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven Verify
        run: mvn -B clean verify

  deploy:
    name: Railway Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway
        run: npm i -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
